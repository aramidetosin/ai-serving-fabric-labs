# serving-layer manifests for sfab-ch09: rendered by serving.py from serving.env
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-a-worker0
  namespace: serving
  labels:
    app.kubernetes.io/name: serving
    app.kubernetes.io/component: worker
    tarnwick.example/model: chat
    tarnwick.example/copy: a
    tarnwick.example/role: worker
    tarnwick.example/pod: chat-a-worker0-0
    tarnwick.example/rail: rail3
    decision.tarnwick.example/id: dec-place-chat
spec:
  replicas: 1
  serviceName: chat-a-worker0
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: serving
      tarnwick.example/pod: chat-a-worker0-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving
        app.kubernetes.io/component: worker
        tarnwick.example/model: chat
        tarnwick.example/copy: a
        tarnwick.example/role: worker
        tarnwick.example/pod: chat-a-worker0-0
        tarnwick.example/rail: rail3
        decision.tarnwick.example/id: dec-place-chat
      annotations:
        k8s.v1.cni.cncf.io/networks: "[{\"name\":\"rail3\",\"namespace\":\"serving\",\"interface\":\"rail3\",\"ips\":[\"10.21.3.101/24\"],\"mac\":\"02:5a:fe:03:00:65\"}]"
        tarnwick.example/spec: "0ad0b3f6f7fda078"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-gpu1
      restartPolicy: Always
      terminationGracePeriodSeconds: 2
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: "192.0.2.6:5000/sfab/serving:b11382-2"
        imagePullPolicy: IfNotPresent
        command:
        - ggml-rpc-server
        - "-H"
        - "10.21.3.101"
        - "-p"
        - "50052"
        - "-t"
        - "4"
        ports:
        - name: rpc
          containerPort: 50052
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sfab-ready
            - worker
            - "--rpc-port"
            - "50052"
            - "10.21.3.101"
          periodSeconds: 2
          failureThreshold: 2
          timeoutSeconds: 2
        resources:
          requests:
            cpu: "1"
            memory: "14238Mi"
          limits:
            memory: "15774Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
