# Chapter 9, "Split-Horizon DNS", lab sfab-ch09.
#
# Build A's state many at step 9: chapter 8's lab plus the internet side, which the spec adds from
# step 9: the ISP router isp-rtr (its customers' /30s and the firewall's link, all connected, no
# inside route), the internet client inet-client, the platform's public authoritative server
# inet-dns-auth (llm only, answered with the firewall's own isp address 198.51.100.10, recursion off)
# and the provider's resolver inet-dns-res (recursion for 203.0.113.0/26 only, the platform's zone sent
# to inet-dns-auth); on the firewall ethernet1/6 in zone isp (zone protection zp-internet) and the
# route isp-customers, with no rule and no NAT, so the internet client's SYN to the published address
# meets deny-all-log. ops-dns still publishes no platform name. 30 nodes. make up deploys
# the whole step from wiped disks. It extends chapter 8's lab (metadata only).
lab: sfab-ch09
profile: a
state: many
slice:
  nodes: [fe, rail, oob, fw, k8s-gpu1, k8s-gpu2, k8s-cp1, k8s-cp2, k8s-cp3, bastion, inet-registry, uplink-rtr, ops-client, ops-dns, ent-client, isp-rtr, inet-client, inet-dns-auth, inet-dns-res]
features: {k8s: true, serving: true, storage_setup: false}
prints: []
extends: ch08
variants: {}

# The keyed trace (trace.sh, common/trace/lib-servetrace.sh; rendered to gen/trace.json): chapter 7's
# form, kept until Part III's own forms land (the record stage): one request from the staff client to
# staff's path through the users' Gateway with helpdesk's key, every key replaced by its keyed mark,
# then an admin hostname the users' Gateway does not carry, answered 404 there with no API gateway
# line.
trace:
  serving:
    client: ent-client
    gateway: gw-users
    model: staff
    max_tokens: 16
    sport: 42906
    keys: true
    refuse: {hostname: admin, path: /echo, sport: 42907}
