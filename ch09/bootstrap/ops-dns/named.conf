// sfab-ch09 ops-dns: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
// named.conf: named's whole configuration, an authoritative server (recursion off). sfab-dns checks it
// and its zones, installs them as /etc/sfab/dns/named.conf and /etc/sfab/dns/zones/ with the TSIG keys in
// /etc/sfab/dns/keys/, and reloads. Views answer by the asking resolver's address, and a zone transfer or
// NOTIFY by its view's TSIG key.

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    listen-on port 53 { 127.0.0.1; 192.0.2.10; };
    listen-on-v6 { none; };
    recursion no;
    allow-recursion { none; };
    allow-query-cache { none; };
    allow-transfer { none; };
    notify no;
    dnssec-validation no;
    querylog yes;
    version none;
    hostname none;
    server-id none;
};

logging {
    channel general { file "/var/log/named/named.log" versions 2 size 5m; print-time yes; severity info; };
    channel queries { file "/var/log/named/queries.log" versions 2 size 5m; print-time yes; };
    category default { general; };
    category queries { queries; };
    category lame-servers { null; };
};

include "/run/named/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

acl public-operator-clients { 192.0.2.0/26; };  // operator

// decision dec-view-public: view public-operator for operator: no answer for the names users type; recursion off
view "public-operator" {
    match-clients { 127.0.0.1; public-operator-clients; };
    recursion no;
    zone "ai.tarnwick.example" { type primary; file "/etc/sfab/dns/zones/db.public-operator.ai.tarnwick.example"; };
};
