kind: Service
metadata:
  name: router
  namespace: inference
  labels:
    app.kubernetes.io/name: router
    app.kubernetes.io/part-of: inference
    app.kubernetes.io/component: router
spec:
  selector:
    app.kubernetes.io/name: router
  ports:
  - name: http
    port: 4000
    targetPort: http
    protocol: TCP
