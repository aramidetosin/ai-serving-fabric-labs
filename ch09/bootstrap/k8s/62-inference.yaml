apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: models-gw-internal
  namespace: inference
  labels:
    tarnwick.example/audience: internal
    decision.tarnwick.example/id: dec-routeset-internal
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw-internal
    namespace: gateways
    sectionName: https
  hostnames:
  - llm.ai.tarnwick.example
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /models
    backendRefs:
    - name: api-gateway
      port: 9080
    timeouts:
      request: "620s"
      backendRequest: "620s"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: models-gw-users
  namespace: inference
  labels:
    tarnwick.example/audience: enterprise
    decision.tarnwick.example/id: dec-routeset-enterprise
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw-users
    namespace: gateways
    sectionName: https
  hostnames:
  - llm.ai.tarnwick.example
  rules:
  - matches:
