// sfab-ch09 inet-dns-res: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
// named.conf: named's whole configuration, a recursive resolver for its customers' segments outside the platform. sfab-dns
// checks it and its zones, installs them as /etc/sfab/dns/named.conf and /etc/sfab/dns/zones/, and reloads.
// The platform's zone and its reverse zones go to the authoritative servers (static-stub); every
// other name ends at this resolver's own empty root (NXDOMAIN), so no query leaves the lab.

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    listen-on port 53 { 127.0.0.1; 203.0.113.10; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 127.0.0.1; isp-clients; };
    allow-query { 127.0.0.1; isp-clients; };
    allow-query-cache { 127.0.0.1; isp-clients; };
    allow-transfer { none; };
    notify no;
    dnssec-validation no;
    querylog yes;
    version none;
    hostname none;
    server-id none;
};

logging {
    channel general { file "/var/log/named/named.log" versions 2 size 5m; print-time yes; severity info; };
    channel queries { file "/var/log/named/queries.log" versions 2 size 5m; print-time yes; };
    category default { general; };
    category queries { queries; };
    category lame-servers { null; };
};

include "/run/named/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

acl isp-clients { 203.0.113.0/26; };  // internet

zone "ai.tarnwick.example" { type static-stub; server-addresses { 203.0.113.6; }; };  // inet-dns-auth
zone "." { type primary; file "/etc/sfab/dns/zones/db.inet-dns-res.root"; };
