! sfab-ch11 uplink-rtr: rendered from spec/profile-a.yaml by render/frr.py; edit the spec and run make render
! eth0 is in VRF mgmt (frr-init.sh), so the default table holds only the lab's routes.
! This file is bound read-only: change the spec and run make render, never write memory.
frr defaults traditional
hostname uplink-rtr
log stdout informational
service integrated-vtysh-config
!
! operator-site: dec-route-operator-site
ip route 192.0.2.0/30 192.0.2.22
! inside-nodes: dec-route-inside-via-fw
ip route 10.20.1.0/24 198.51.100.2
! inside-ingress: dec-route-inside-via-fw
ip route 10.20.11.0/24 198.51.100.2
! inside-stor-mgmt: dec-route-inside-via-fw
ip route 10.20.2.0/24 198.51.100.2
! inside-bastion: dec-route-inside-via-fw
ip route 10.20.3.0/24 198.51.100.2
! inside-services-a: dec-route-inside-via-fw
ip route 10.20.13.0/24 198.51.100.2
! inside-services-b: dec-route-inside-via-fw
ip route 10.20.14.0/24 198.51.100.2
! inside-oob: dec-route-inside-via-fw
ip route 10.20.9.0/24 198.51.100.2
! inside-enterprise: dec-route-inside-via-fw
ip route 10.24.10.0/24 198.51.100.2
!
interface eth1
