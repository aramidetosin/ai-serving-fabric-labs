- id: key
  layer: Caller
  owner: "API gateway"
  object: "One route per model, admitting the consumer groups of the callers that may call it; one group per caller, its consumers an application's keys or the people its identity provider signs in"
  decision: "Whether the caller may use the model"
  evidence: "The API gateway's 401 with the message it gives an unknown credential, the same for a credential of a caller the model's route does not admit; it names neither the credential nor its consumer"
  refusal: "401"
  prefix: dec-key-
  objects:
  - kind: "consumer group"
    name: batch
    device: api-gateway
    route: /models/a48b3df9-3b7f-58f0-9c52-c6f3004f05f7
    models:
    - chat
    caller_kind: application
    decision: dec-key-batch
    stamped: "the consumer group's desc in the ConfigMap api-gateway-routes"
  - kind: "consumer group"
    name: helpdesk
    device: api-gateway
    route: /models/8242d5c4-9bce-5497-8414-f5bad94fdd84
    models:
