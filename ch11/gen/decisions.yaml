- id: nat
  layer: NAT
  owner: firewall
  object: "The NAT rulebase: the internet users' destination NAT from the isp zone on the firewall's own isp address to the internet Gateway's VIP, the no-translation rule for the public address and source NAT for the allowlisted egress; nothing is published on the uplink"
  decision: "Which address a request leaves or lands with, keyed on the pre-NAT zone"
  evidence: "The session's NAT rule and translated address"
  refusal: none
  note: "an untranslated request goes on to policy"
  prefix: dec-nat-
  objects:
  - kind: "NAT rule"
    name: dnat-internet-gateway
    device: fw
    from:
    - isp
    to:
    - isp
    translation: "destination 10.20.11.220"
    decision: dec-nat-internet
    stamped: "the rule's description"
  - kind: "NAT rule"
    name: no-nat-public
    device: fw
    from:
    - k8s-nodes
    - services
    to:
    - uplink
    translation: none
    decision: dec-nat-no-land
    stamped: "the rule's description"
  - kind: "NAT rule"
    name: internet-snat
    device: fw
    from:
    - k8s-nodes
    - services
    to:
    - uplink
    translation: "source, ethernet1/5's address"
    decision: dec-nat-internet-snat
    stamped: "the rule's description"
