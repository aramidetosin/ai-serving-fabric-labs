# sfab-ch11 decisions: rendered from spec/profile-a.yaml by render/decisions.py; edit the spec and run make render
# The decision table (Table 2-1): one row per layer, in the order a request meets them, each with the objects of
# this lab that implement it and the decision id each carries. label.sh reads gen/decisions.json, the same data
# with its plan of reads, and prints the live object behind every row.
schema: 1
lab: sfab-ch11
build: A
org: Tarnwick
label: decision.tarnwick.example/id
rows:
- id: view
  layer: "Resolver view"
  owner: resolver
  object: "The platform's authoritative pair, with an internal view for the platform's resolvers and an enterprise view for the corporate resolver; a public server on the internet side that publishes the users' name from Chapter 9; the uplink side's server publishes none"
  decision: "Which address a population gets for a name"
  evidence: "The answer dig returns on the population's own client"
  refusal: none
  note: "a wrong answer moves the request to another layer's refusal"
  prefix: dec-view-
  objects:
  - kind: "DNS view"
    name: internal
    device: dns-auth1
    server_kind: bind-auth
    match:
    - node:dns-res1
    - node:dns-res2
    answer: "10.20.11.200"
    decision: dec-view-internal
    servers:
    - dns-auth1
    - dns-auth2
    stamped: "zone file comments, bootstrap/dns-auth1/zones/db.internal.ai.tarnwick.example, and the view's comment in named.conf"
  - kind: "DNS view"
    name: enterprise
    device: dns-auth1
    server_kind: bind-auth
    match:
    - node:ent-dns
    answer: "10.20.11.210"
    decision: dec-view-enterprise
    servers:
    - dns-auth1
    - dns-auth2
    stamped: "zone file comments, bootstrap/dns-auth1/zones/db.enterprise.ai.tarnwick.example, and the view's comment in named.conf"
  - kind: "DNS view"
    name: public-operator
    device: ops-dns
    server_kind: bind-auth
    match:
    - operator
    answer: "198.51.100.2"
    decision: dec-view-public
    servers:
    - ops-dns
    stamped: "zone file comments, bootstrap/ops-dns/zones/db.public-operator.ai.tarnwick.example, and the view's comment in named.conf"
  - kind: "DNS view"
    name: public-internet
    device: inet-dns-auth
    server_kind: bind-auth
    match:
    - internet
    answer: "198.51.100.10"
    decision: dec-view-public
    servers:
    - inet-dns-auth
    stamped: "zone file comments, bootstrap/inet-dns-auth/zones/db.public-internet.ai.tarnwick.example, and the view's comment in named.conf"
