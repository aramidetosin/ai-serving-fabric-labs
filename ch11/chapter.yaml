# Chapter 11, "Validating Tenant Isolation", lab sfab-ch11.
#
# Build A's state many at step 11, with the decision table and the matrix (decisions: true, as
# chapter 2's lab): chapter 10's lab plus web-client (the matrix's internet host row) and TrueNAS
# (the matrix's two storage columns need the storage system, as in chapter 2's lab, so storage_setup
# is on here, unlike chapters 8 to 10). The
# matrix holds five rows (Staff, Operator, Nodes, Internet host, Internet users) and twelve columns
# (chapter 2's eleven and the internet Gateway): 60 cells, each with its isolation depth (the layers
# that would refuse it if every earlier layer let it through) and each model cell's own key chosen per
# population (inetapp for the internet users). make up deploys the whole step from wiped disks. It
# extends chapter 10's lab (metadata only).
lab: sfab-ch11
profile: a
state: many
slice:
  nodes: [fe, rail, oob, fw, k8s-gpu1, k8s-gpu2, k8s-cp1, k8s-cp2, k8s-cp3, bastion, inet-registry, uplink-rtr, ops-client, web-client, ops-dns, ent-client, truenas1, isp-rtr, inet-client, inet-dns-auth, inet-dns-res]
features: {k8s: true, serving: true, storage_setup: true}
prints: []
extends: ch10
variants: {}
decisions: true

# The capture ladder (trace.sh, common/trace/lib-ladder.sh; rendered to gen/trace.json): every
# population of the matrix connects to each Gateway's VIP (the internet users at their answer, the
# published address) from its own source ports, a forbidden cell three times, while every rung
# captures: the ISP router's link, the staff's firewall port, both legs of the bundle, the pair's
# ports facing the ingress nodes and each ingress node's VLAN 110 unit. A warm-up connect per
# population comes first, so the pair's MAC tables hold the lease holders' MACs, and the ports
# facing a holder are read from those tables (show mac address-table), never from names. Per rung,
# the SYNs of each flow by distinct sequence number, and each forbidden flow's tally past the device
# that refuses it, which must be zero.
trace:
  ladder:
    sport: 44100
    tries: 3

# The held connections (as chapter 10's) and the negative checks of the audit (gen/tenancy.json).
tenancy:
  hold: {n: 8, hold_s: 120, every_s: 20, sport: 44500, slack: 2}
  isolation: true

# The drill (drills.sh, common/drill/lib-isodrill.sh; rendered to gen/drills.json): each population
# holds chapter 10's connections and probes its own Gateway's /echo every 3 s while it tries the
# matrix's cells it must not reach (the other Gateways' VIPs, staff's path on the internet Gateway,
# the admin hostnames), ten rounds; one line a population with its allowed count and its zeros; then
# again at twice the held connections. Then the leaked key (below).
drills:
  timing: {lead_s: 10, tail_s: 10, settle_max_s: 300, whole_polls: 3}
  list:
    - id: isolation-under-load
      title: every population's own Gateway under held load, and every forbidden try refused
      isolation: {rounds: 10, interval_s: 3, factors: [1, 2]}
    # the one cell no network layer holds: a new key of batch, an enterprise caller, minted, sent from
    # the internet client through the internet Gateway to chat, answered and logged under batch; then
    # revoked and refused. A caller's credential is not bound to a Gateway: revocation alone holds it.
    - id: leaked-key
      title: an enterprise caller's key used from the internet, answered, then refused after its revoke
      leaked_key: {from: inet-client, model: chat, caller: batch, id_base: fb000000, interval_s: 2, accept_max_s: 300}
