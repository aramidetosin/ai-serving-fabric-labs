# sfab-m2 inet-ntp: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
# The upstream time reference, a stand-in for an internet NTP service: it serves the clock of the
# host the container shares (the lab host's) as a local reference, to anyone, and with -x never
# adjusts it.
# NTS key exchange on TCP 4460, with the key and chain the image installs from /sfab/tls.
local stratum 2
bindaddress 192.0.2.14
allow all
ntsserverkey /run/sfab/tls/tls.key
ntsservercert /run/sfab/tls/chain.crt
cmdport 0
