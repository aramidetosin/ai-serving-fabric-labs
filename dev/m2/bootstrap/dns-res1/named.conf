// sfab-m2 dns-res1: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
// named.conf: named's whole configuration, a recursive resolver for the inside segments. sfab-dns
// checks it and its zones, installs them as /etc/sfab/dns/named.conf and /etc/sfab/dns/zones/, and reloads.
// The platform's zone and its reverse zones go to the authoritative servers (static-stub); every
// other name ends at this resolver's own empty root (NXDOMAIN), so no query leaves the lab.

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    listen-on port 53 { 127.0.0.1; 10.20.13.21; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 127.0.0.1; inside-clients; };
    allow-query { 127.0.0.1; inside-clients; };
    allow-query-cache { 127.0.0.1; inside-clients; };
    allow-transfer { none; };
    notify no;
    dnssec-validation no;
    querylog yes;
    version none;
    hostname none;
    server-id none;
};

logging {
    channel general { file "/var/log/named/named.log" versions 2 size 5m; print-time yes; severity info; };
    channel queries { file "/var/log/named/queries.log" versions 2 size 5m; print-time yes; };
    category default { general; };
    category queries { queries; };
    category lame-servers { null; };
};

include "/run/named/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

acl inside-clients { 10.20.1.0/24; 10.20.11.0/24; 10.20.2.0/24; 10.20.3.0/24; 10.20.9.0/24; 10.20.13.0/24; 10.20.14.0/24; };  // nodes, ingress, stor-mgmt, bastion, oob, services-a, services-b

zone "ai.tarnwick.example" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "1.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "2.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "3.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "11.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "12.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "13.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "14.20.10.in-addr.arpa" { type static-stub; server-addresses { 10.20.13.11; 10.20.14.11; }; };  // dns-auth1, dns-auth2
zone "." { type primary; file "/etc/sfab/dns/zones/db.dns-res1.root"; };
