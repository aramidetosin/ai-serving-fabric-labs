# serving-layer manifests for sfab-ch01: rendered by serving.py from serving.env
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-a-server
  namespace: serving
  labels:
    app.kubernetes.io/name: serving
    app.kubernetes.io/component: server
    tarnwick.example/model: chat
    tarnwick.example/copy: a
    tarnwick.example/role: server
    tarnwick.example/pod: chat-a-server-0
    tarnwick.example/rail: rail3
    decision.tarnwick.example/id: dec-place-chat
spec:
  replicas: 1
  serviceName: chat-a-server
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: serving
      tarnwick.example/pod: chat-a-server-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving
        app.kubernetes.io/component: server
        tarnwick.example/model: chat
        tarnwick.example/copy: a
        tarnwick.example/role: server
        tarnwick.example/pod: chat-a-server-0
        tarnwick.example/rail: rail3
        decision.tarnwick.example/id: dec-place-chat
      annotations:
        k8s.v1.cni.cncf.io/networks: "[{\"name\":\"rail3\",\"namespace\":\"serving\",\"interface\":\"rail3\",\"ips\":[\"10.21.3.100/24\"],\"mac\":\"02:5a:fe:03:00:64\"}]"
        tarnwick.example/spec: "96a5f2b745733bc2"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-gpu1
      restartPolicy: Always
      terminationGracePeriodSeconds: 2
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: "192.0.2.6:5000/sfab/serving:b11382-2"
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SFAB_READY_HOST
          value: "$(POD_IP)"
        command:
        - llama-server
        - "-m"
        - /models/LFM2.5-24B-A2B-Q4_K_M.gguf
        - "--alias"
        - chat
        - "--host"
        - "$(POD_IP)"
        - "--port"
        - "8080"
        - "--rpc"
        - "10.21.3.101:50052"
        - "-ngl"
        - "99"
        - "-c"
        - "4096"
        - "-np"
        - "8"
        - "-n"
        - "256"
        - "-t"
        - "2"
        - "--reasoning-budget"
        - "0"
        - "--cache-ram"
        - "0"
        - "--ctx-checkpoints"
        - "0"
        - "--no-ui"
        - "--api-key-file"
        - /secret/key
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sfab-ready
            - server
            - "--port"
            - "8080"
            - "--rpc-port"
            - "50052"
            - "--probe-port"
            - "50053"
            - "10.21.3.101"
          periodSeconds: 2
          failureThreshold: 2
          timeoutSeconds: 2
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            memory: "4Gi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: key
          mountPath: /secret
          readOnly: true
        - name: models
          mountPath: /models
          readOnly: true
      volumes:
      - name: key
        secret:
          secretName: llm-api-key
          defaultMode: 288
          items:
          - key: key
            path: key
      - name: models
        persistentVolumeClaim:
          claimName: models-k8s-gpu1
          readOnly: true
