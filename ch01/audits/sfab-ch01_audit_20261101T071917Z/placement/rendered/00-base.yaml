---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving-keys
  namespace: serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: serving-keys
  namespace: serving
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - llm-api-key
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: serving-keys
  namespace: serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: serving-keys
subjects:
- kind: ServiceAccount
  name: serving-keys
  namespace: serving
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: serving-models-k8s-gpu1
  labels:
    app.kubernetes.io/name: serving
    tarnwick.example/namespace: serving
    tarnwick.example/node: k8s-gpu1
spec:
  capacity:
    storage: "29Gi"
  accessModes:
  - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: serving-models
  volumeMode: Filesystem
  local:
    path: /srv/models
  claimRef:
    namespace: serving
    name: models-k8s-gpu1
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-gpu1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-k8s-gpu1
  namespace: serving
  labels:
    app.kubernetes.io/name: serving
    tarnwick.example/namespace: serving
    tarnwick.example/node: k8s-gpu1
spec:
  accessModes:
  - ReadOnlyMany
  storageClassName: serving-models
  volumeName: serving-models-k8s-gpu1
  resources:
    requests:
      storage: "29Gi"
---
