# serving-layer manifests for sfab-ch01: rendered by serving.py from serving.env
apiVersion: v1
kind: Namespace
metadata:
  name: serving
  labels:
    app.kubernetes.io/name: serving
    pod-security.kubernetes.io/enforce: restricted
    routes.tarnwick.example/gw-internal: "true"
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rail3
  namespace: serving
  labels:
    app.kubernetes.io/name: serving
spec:
  config: "{\"cniVersion\":\"1.0.0\",\"name\":\"rail3\",\"type\":\"macvlan\",\"master\":\"rail3\",\"mode\":\"bridge\",\"mtu\":9000,\"capabilities\":{\"ips\":true,\"mac\":true},\"ipam\":{\"type\":\"static\"}}"
---
