// sfab-ch01 dns-auth2: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
// named.conf: named's whole configuration, an authoritative server (recursion off). sfab-dns checks it
// and its zones, installs them as /etc/sfab/dns/named.conf and /etc/sfab/dns/zones/ with the TSIG keys in
// /etc/sfab/dns/keys/, and reloads. Views answer by the asking resolver's address, and a zone transfer or
// NOTIFY by its view's TSIG key.

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";
    listen-on port 53 { 127.0.0.1; 10.20.14.11; };
    listen-on-v6 { none; };
    recursion no;
    allow-recursion { none; };
    allow-query-cache { none; };
    allow-transfer { none; };
    notify no;
    dnssec-validation no;
    querylog yes;
    version none;
    hostname none;
    server-id none;
};

logging {
    channel general { file "/var/log/named/named.log" versions 2 size 5m; print-time yes; severity info; };
    channel queries { file "/var/log/named/queries.log" versions 2 size 5m; print-time yes; };
    category default { general; };
    category queries { queries; };
    category lame-servers { null; };
};

include "/run/named/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

include "/etc/sfab/dns/keys/internal-xfr.key";  // view internal's transfers; made per lab, never rendered
include "/etc/sfab/dns/keys/enterprise-xfr.key";  // view enterprise's transfers; made per lab, never rendered
acl internal-clients { 10.20.13.21/32; 10.20.14.21/32; };  // node:dns-res1, node:dns-res2
acl enterprise-clients { 10.24.10.53/32; };  // node:ent-dns

// decision dec-view-internal: view internal for node:dns-res1, node:dns-res2: users, admin, internal, identity names answer 10.20.11.200 (vip:gw-internal); the infrastructure records; recursion off; primary dns-auth1, secondary dns-auth2 by transfer keyed with internal-xfr
view "internal" {
    match-clients { key "internal-xfr"; !key "enterprise-xfr"; 127.0.0.1; internal-clients; };
    recursion no;
    server 10.20.13.11 { keys "internal-xfr"; };  // dns-auth1, the primary
    zone "ai.tarnwick.example" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.ai.tarnwick.example"; allow-notify { 10.20.13.11; }; };
    zone "1.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.1.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
    zone "2.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.2.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
    zone "3.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.3.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
    zone "11.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.11.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
    zone "12.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.12.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
    zone "13.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.13.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
    zone "14.20.10.in-addr.arpa" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.internal.14.20.10.in-addr.arpa"; allow-notify { 10.20.13.11; }; };
};

// decision dec-view-enterprise: view enterprise for node:ent-dns: users, identity names answer 10.20.11.210 (vip:gw-users); recursion off; primary dns-auth1, secondary dns-auth2 by transfer keyed with enterprise-xfr
view "enterprise" {
    match-clients { key "enterprise-xfr"; !key "internal-xfr"; enterprise-clients; };
    recursion no;
    server 10.20.13.11 { keys "enterprise-xfr"; };  // dns-auth1, the primary
    zone "ai.tarnwick.example" { type secondary; primaries { 10.20.13.11; }; file "secondary/db.enterprise.ai.tarnwick.example"; allow-notify { 10.20.13.11; }; };
};
