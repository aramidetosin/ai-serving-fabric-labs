# sfab-ch01 identity provider: rendered from spec/profile-a.yaml by render/k8s.py; edit the spec and run make render
# Dex stands in for the enterprise's identity provider, published on gw-internal, gw-users as id.ai.tarnwick.example.
# Its configuration names no secret: the clients' secrets and the people's password hashes come from the Secret idp-credentials,
# which finish writes from the lab host (common/bin/idp-secret.py). A token is for the API gateway only when its
# aud names ai-gateway, which Dex writes for a client that client trusts (trustedPeers).
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    pod-security.kubernetes.io/enforce: restricted
    routes.tarnwick.example/gw-internal: "true"
    routes.tarnwick.example/gw-users: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: idp-config
  namespace: identity
  labels:
    app.kubernetes.io/name: idp
data:
  config.yaml: |
    issuer: https://id.ai.tarnwick.example
    storage:
      type: memory
    web:
      http: "0.0.0.0:5556"
    logger:
      level: info
      format: json
    oauth2:
      passwordConnector: local
      skipApprovalScreen: true
      responseTypes:
      - code
    enablePasswordDB: true
    expiry:
      idTokens: "60m"
      signingKeys: "6h"
    staticClients:
    - id: ai-gateway
      name: "The API gateway"
      public: true
      trustedPeers:
      - staff-cli
    - id: staff-cli
      name: "Tarnwick staff tools"
      secretEnv: SFAB_IDP_CLIENT_STAFF_CLI
    staticPasswords:
    - email: ent-client@tarnwick.example
      hashFromEnv: SFAB_IDP_HASH_ENT_CLIENT
      username: ent-client
      userID: "2bede32b-083f-5c16-931f-c7baf7061443"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
  namespace: identity
  labels:
    app.kubernetes.io/name: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp
      annotations:
        tarnwick.example/config: ca85d1ed5b68a31f
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dex
        image: docker.io/dexidp/dex@sha256:fd4ab5d117005b927433133f1d7db7cc30fbb537c377912b75b349edff47df01
        imagePullPolicy: IfNotPresent
        command:
        - dex
        - serve
        - /etc/dex/config.yaml
        envFrom:
        - secretRef:
            name: idp-credentials
        ports:
        - name: http
          containerPort: 5556
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "20m"
            memory: "48Mi"
          limits:
            memory: "192Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/dex
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: idp-config
      nodeSelector:
        node-role.tarnwick.example/ingress: ""
      tolerations:
      - key: node-role.tarnwick.example/ingress
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: idp
  namespace: identity
  labels:
    app.kubernetes.io/name: idp
spec:
  selector:
    app.kubernetes.io/name: idp
  ports:
  - name: http
    port: 5556
    targetPort: http
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp-gw-internal
  namespace: identity
  labels:
    tarnwick.example/audience: internal
    decision.tarnwick.example/id: dec-routeset-internal
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw-internal
    namespace: gateways
    sectionName: https
  hostnames:
  - id.ai.tarnwick.example
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: idp
      port: 5556
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp-gw-users
  namespace: identity
  labels:
    tarnwick.example/audience: enterprise
    decision.tarnwick.example/id: dec-routeset-enterprise
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw-users
    namespace: gateways
    sectionName: https
  hostnames:
  - id.ai.tarnwick.example
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: idp
      port: 5556
