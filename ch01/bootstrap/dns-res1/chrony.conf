# sfab-ch01 dns-res1: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
# A time server for the inside segments. It follows the upstream reference over NTS (RFC 8915; the reference's certificate chains to the lab root),
# and serves its own clock as a local reference when the reference is out of reach. chronyd runs
# with -x, so it never adjusts the clock of the host the container shares (the lab host's).
server 192.0.2.14 iburst nts
ntstrustedcerts /shared/ca/root.crt
ntsdumpdir /var/lib/chrony
local stratum 10
bindaddress 10.20.13.21
allow 10.20.1.0/24
allow 10.20.11.0/24
allow 10.20.2.0/24
allow 10.20.3.0/24
allow 10.20.9.0/24
allow 10.20.13.0/24
allow 10.20.14.0/24
cmdport 0
