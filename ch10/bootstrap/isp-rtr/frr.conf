! sfab-ch10 isp-rtr: rendered from spec/profile-a.yaml by render/frr.py; edit the spec and run make render
! eth0 is in VRF mgmt (frr-init.sh), so the default table holds only the lab's routes.
! This file is bound read-only: change the spec and run make render, never write memory.
frr defaults traditional
hostname isp-rtr
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description fw-eth6
 ip address 198.51.100.9/30
exit
!
interface eth2
 description inet-client-eth1
 ip address 203.0.113.1/30
exit
!
interface eth3
 description inet-dns-auth-eth1
 ip address 203.0.113.5/30
exit
!
interface eth4
 description inet-dns-res-eth1
 ip address 203.0.113.9/30
exit
!
end
