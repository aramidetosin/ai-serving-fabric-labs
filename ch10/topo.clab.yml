        SFAB_NODE: "k8s-gpu2"
        VM_DISK_GIB: "80"
        VM_MEMORY_MB: "43008"
        VM_NICS: "eth1 eth2 eth3 eth4 eth5 eth6 eth7 eth8 eth9 eth10 eth11"
        VM_SMP: "12"
        VM_TX_OFF: "1"
      binds:
