    - endpoints: ["k8s-cp3:eth2", "fe-sw2:eth6"]  # k8s-cp3.bond, fe-sw2 Ethernet5
    - endpoints: ["k8s-cp3:eth3", "oob-sw:eth6"]  # k8s-cp3.oob, oob-sw Ethernet5
    - endpoints: ["k8s-gpu1:eth1", "fe-sw1:eth7"]  # k8s-gpu1.bond, fe-sw1 Ethernet6
    - endpoints: ["k8s-gpu1:eth2", "fe-sw2:eth7"]  # k8s-gpu1.bond, fe-sw2 Ethernet6
    - endpoints: ["k8s-gpu1:eth3", "oob-sw:eth1"]  # k8s-gpu1.oob, oob-sw Ethernet0
    - endpoints: ["k8s-gpu1:eth4", "rail-sw1:eth1"]  # k8s-gpu1.rail1, rail-sw1 Ethernet0
    - endpoints: ["k8s-gpu1:eth5", "rail-sw2:eth1"]  # k8s-gpu1.rail2, rail-sw2 Ethernet0
    - endpoints: ["k8s-gpu1:eth6", "rail-sw1:eth2"]  # k8s-gpu1.rail3, rail-sw1 Ethernet1
    - endpoints: ["k8s-gpu1:eth7", "rail-sw2:eth2"]  # k8s-gpu1.rail4, rail-sw2 Ethernet1
    - endpoints: ["k8s-gpu1:eth8", "rail-sw1:eth3"]  # k8s-gpu1.rail5, rail-sw1 Ethernet2
    - endpoints: ["k8s-gpu1:eth9", "rail-sw2:eth3"]  # k8s-gpu1.rail6, rail-sw2 Ethernet2
    - endpoints: ["k8s-gpu1:eth10", "rail-sw1:eth4"]  # k8s-gpu1.rail7, rail-sw1 Ethernet3
    - endpoints: ["k8s-gpu1:eth11", "rail-sw2:eth4"]  # k8s-gpu1.rail8, rail-sw2 Ethernet3
    - endpoints: ["k8s-gpu2:eth1", "fe-sw1:eth8"]  # k8s-gpu2.bond, fe-sw1 Ethernet7
    - endpoints: ["k8s-gpu2:eth2", "fe-sw2:eth8"]  # k8s-gpu2.bond, fe-sw2 Ethernet7
    - endpoints: ["k8s-gpu2:eth3", "oob-sw:eth2"]  # k8s-gpu2.oob, oob-sw Ethernet1
    - endpoints: ["k8s-gpu2:eth4", "rail-sw1:eth5"]  # k8s-gpu2.rail1, rail-sw1 Ethernet4
    - endpoints: ["k8s-gpu2:eth5", "rail-sw2:eth5"]  # k8s-gpu2.rail2, rail-sw2 Ethernet4
    - endpoints: ["k8s-gpu2:eth6", "rail-sw1:eth6"]  # k8s-gpu2.rail3, rail-sw1 Ethernet5
    - endpoints: ["k8s-gpu2:eth7", "rail-sw2:eth6"]  # k8s-gpu2.rail4, rail-sw2 Ethernet5
    - endpoints: ["k8s-gpu2:eth8", "rail-sw1:eth7"]  # k8s-gpu2.rail5, rail-sw1 Ethernet6
    - endpoints: ["k8s-gpu2:eth9", "rail-sw2:eth7"]  # k8s-gpu2.rail6, rail-sw2 Ethernet6
    - endpoints: ["k8s-gpu2:eth10", "rail-sw1:eth8"]  # k8s-gpu2.rail7, rail-sw1 Ethernet7
    - endpoints: ["k8s-gpu2:eth11", "rail-sw2:eth8"]  # k8s-gpu2.rail8, rail-sw2 Ethernet7
