    - endpoints: ["fw:eth3", "oob-sw:eth3"]  # fw.oob, oob-sw Ethernet2
    - endpoints: ["fw:eth4", "ent-client:eth1"]  # fw.enterprise
    - endpoints: ["fw:eth5", "uplink-rtr:eth1"]  # fw.uplink
    - endpoints: ["fw:eth6", "isp-rtr:eth1"]  # fw.isp
    - endpoints: ["fw:eth7", "ent-dns:eth1"]  # fw.enterprise-dns
