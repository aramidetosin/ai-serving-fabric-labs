    - endpoints: ["k8s-cp2:eth1", "fe-sw1:eth5"]  # k8s-cp2.bond, fe-sw1 Ethernet4
    - endpoints: ["k8s-cp2:eth2", "fe-sw2:eth5"]  # k8s-cp2.bond, fe-sw2 Ethernet4
    - endpoints: ["k8s-cp2:eth3", "oob-sw:eth5"]  # k8s-cp2.oob, oob-sw Ethernet4
