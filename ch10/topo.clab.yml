# sfab-ch10: rendered from spec/profile-a.yaml and ch10/chapter.yaml; edit the spec and run make render.
# Build A, state many, step 10. Containers are sfab-ch10-<node>, the lab directory clab-sfab-ch10/.
# No credential is referenced here: the nodes that log in with a password keep their kinds'
# default logins, which the harness reads from each container. No secret is written here.
name: sfab-ch10
prefix: __lab-name
mgmt:
  network: sfab-a-mgmt
  bridge: sfab-a-mgmt
  ipv4-subnet: 172.21.40.0/24
  ipv4-gw: "172.21.40.1"
topology:
  nodes:
    fe-sw1:
      kind: dell_sonic
      image: vrnetlab/dell_sonic:4.6.0
      mgmt-ipv4: "172.21.40.11"
      sysctls:
        net.ipv6.conf.default.disable_ipv6: "1"
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
        NUM_NICS: "19"
      binds:
        - bootstrap/fe-sw1/startup-config.cfg:/config/startup-config.cfg:ro
    fe-sw2:
      kind: dell_sonic
      image: vrnetlab/dell_sonic:4.6.0
      mgmt-ipv4: "172.21.40.12"
      sysctls:
        net.ipv6.conf.default.disable_ipv6: "1"
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
        NUM_NICS: "19"
      binds:
        - bootstrap/fe-sw2/startup-config.cfg:/config/startup-config.cfg:ro
    rail-sw1:
      kind: dell_sonic
      image: vrnetlab/dell_sonic:4.6.0
      mgmt-ipv4: "172.21.40.21"
      sysctls:
        net.ipv6.conf.default.disable_ipv6: "1"
      env:
        NUM_NICS: "8"
      binds:
        - bootstrap/rail-sw1/startup-config.cfg:/config/startup-config.cfg:ro
    rail-sw2:
      kind: dell_sonic
      image: vrnetlab/dell_sonic:4.6.0
      mgmt-ipv4: "172.21.40.22"
      sysctls:
        net.ipv6.conf.default.disable_ipv6: "1"
      env:
        NUM_NICS: "8"
      binds:
        - bootstrap/rail-sw2/startup-config.cfg:/config/startup-config.cfg:ro
    oob-sw:
      kind: dell_sonic
      image: vrnetlab/dell_sonic:4.6.0
      mgmt-ipv4: "172.21.40.31"
      sysctls:
        net.ipv6.conf.default.disable_ipv6: "1"
      env:
        NUM_NICS: "8"
      binds:
        - bootstrap/oob-sw/startup-config.cfg:/config/startup-config.cfg:ro
    fw:
      kind: paloalto_panos
      image: vrnetlab/paloalto_pa-vm:12.1.2
      mgmt-ipv4: "172.21.40.40"
      startup-config: bootstrap/fw/startup-config.xml
      env:
        QEMU_CPU: "host"
        QEMU_MEMORY: "16384"
        QEMU_SMP: "8"
    k8s-cp1:
      kind: linux
      image: sfab/vm-node:6-k8s1.35.8
      mgmt-ipv4: "172.21.40.101"
      restart-policy: "no"
      devices: [/dev/kvm, /dev/net/tun]
      sysctls:
        net.ipv6.conf.default.disable_ipv6: "1"
      env:
        SFAB_LAB: "sfab-ch10"
        SFAB_NODE: "k8s-cp1"
        VM_DISK_GIB: "40"
        VM_MEMORY_MB: "8192"
        VM_NICS: "eth1 eth2 eth3"
        VM_SMP: "4"
        VM_TX_OFF: "1"
      binds:
        - bootstrap/k8s-cp1:/sfab/bootstrap:ro
        - state/nodes/k8s-cp1:/vm
        - state/shared:/shared
        - state/secrets/authorized_keys:/sfab/authorized_keys:ro
    k8s-cp2:
