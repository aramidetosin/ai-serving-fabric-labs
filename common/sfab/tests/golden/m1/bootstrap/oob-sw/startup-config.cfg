! sfab-m1 oob-sw: rendered from spec/profile-a.yaml; edit the spec and run make render
configure terminal
ip vrf mgmt
end
! role oob_access: VLAN 90, one flat BMC VLAN, no address
configure terminal
interface Vlan 90
exit
interface Ethernet0
description k8s-gpu1-eth3
switchport access Vlan 90
no shutdown
exit
interface Ethernet1
description k8s-gpu2-eth3
switchport access Vlan 90
no shutdown
exit
interface Ethernet2
description fw-eth3
switchport access Vlan 90
no shutdown
exit
end
