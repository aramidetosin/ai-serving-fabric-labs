! sfab-m1 fe-sw1: rendered from spec/profile-a.yaml; edit the spec and run make render
configure terminal
ip vrf mgmt
end
! role mclag_member: pair fe, Layer 2 only, every gateway on the firewall
configure terminal
spanning-tree mode pvst
interface Vlan 100
exit
interface Vlan 110
exit
interface Vlan 120
exit
interface Vlan 130
exit
interface Vlan 131
exit
interface Vlan 200
exit
interface Vlan 300
exit
! the keepalive VRF VrfMclagKa; the backup keepalive on Vlan3966, peer link only
ip vrf VrfMclagKa
interface Vlan 3966
description mclag-backup-keepalive
ip vrf forwarding VrfMclagKa
ip address 10.20.255.4/31
exit
! decision dec-pair-l2-only: PortChannel1, peer-link
interface PortChannel 1
description peer-link
mtu 9216
fast_rate
switchport trunk allowed Vlan 100,110,120,130-131,200,300,3966
no shutdown
exit
interface Ethernet0
description peer-link-1
mtu 9216
channel-group 1
no shutdown
exit
interface Ethernet1
description peer-link-2
mtu 9216
channel-group 1
no shutdown
exit
! the dedicated keepalive link, routed in VrfMclagKa, to 10.20.255.1
interface Ethernet12
description mclag-keepalive
mtu 9216
ip vrf forwarding VrfMclagKa
ip address 10.20.255.0/31
no shutdown
exit
! the domain comes before any mclag line and is never deleted and re-created
mclag domain 1
source-ip 10.20.255.0
peer-ip 10.20.255.1
peer-link PortChannel 1
mclag-system-mac 02:5a:00:00:00:01
session-vrf VrfMclagKa
backup-keepalive source-ip 10.20.255.4
backup-keepalive peer-ip 10.20.255.5
backup-keepalive session-vrf VrfMclagKa
backup-keepalive interval 1
exit
! mclag-separate-ip once the domain exists
interface Vlan 3966
mclag-separate-ip
exit
! decision dec-fw-every-gateway: PortChannel10, fw-ae1
! mtu-floor 9216: fw ae1.100 ae1.110 ae1.200 ae1.300 ae1.130 ae1.131
interface PortChannel 10
description fw-ae1
mtu 9216
fast_rate
mclag 1
switchport trunk allowed Vlan 100,110,130-131,200,300
no shutdown
exit
interface Ethernet2
description fw-eth1
mtu 9216
channel-group 10
no shutdown
exit
interface PortChannel 21
description k8s-gpu1-bond
mtu 9216
fast_rate
mclag 1
switchport access Vlan 100
switchport trunk allowed Vlan 120
spanning-tree portfast
spanning-tree bpduguard port-shutdown
no shutdown
exit
interface Ethernet6
description k8s-gpu1-eth1
mtu 9216
channel-group 21
storm-control broadcast 10000
storm-control unknown-unicast 10000
storm-control unknown-multicast 10000
no shutdown
exit
interface PortChannel 22
description k8s-gpu2-bond
mtu 9216
fast_rate
mclag 1
switchport access Vlan 100
switchport trunk allowed Vlan 120
spanning-tree portfast
spanning-tree bpduguard port-shutdown
no shutdown
exit
interface Ethernet7
description k8s-gpu2-eth1
mtu 9216
channel-group 22
storm-control broadcast 10000
storm-control unknown-unicast 10000
storm-control unknown-multicast 10000
no shutdown
exit
end
