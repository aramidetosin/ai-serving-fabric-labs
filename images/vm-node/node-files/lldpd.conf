# Installed as /etc/lldpd.d/sfab.conf. lldpd runs on the lab wiring only: the bond members,
# the out-of-band NIC and the rail NICs. eth0 is the containerlab management network, and the
# node's own devices (the bond, the relay bridge and its ports, Cilium's and the pods' veths,
# tunnels) would otherwise make the node discover itself.
configure system interface pattern *,!eth0,!lo,!bond*,!relay*,!rl*,!sfmv*,!cilium*,!lxc*,!veth*,!docker*,!kube*,!nodelocal*,!tunl*,!ip6tnl*
configure lldp portidsubtype ifname
# A bond member sends its LLDP frames from its own MAC. lldpd's default ("local") falls back to the
# fixed 00:60:08:69:97:ef when the member's MAC is locally administered, as every lab MAC is, so every
# bonded node would send from that one address and the switches would learn it on whichever port
# spoke last (M2's first deploy, dev/m2/RESULTS.md, problem 2).
configure system bond-slave-src-mac-type real
configure system description "lab node"
