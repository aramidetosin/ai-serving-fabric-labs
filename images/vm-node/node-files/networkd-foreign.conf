# Installed as /etc/systemd/networkd.conf.d/10-sfab-foreign.conf. netsetup.sh, not networkd,
# owns the bond, the out-of-band table, the rail tables and the relay; Cilium owns its own
# rules. By default networkd removes such "foreign" rules and routes whenever it starts.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
