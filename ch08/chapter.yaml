# Chapter 8, "Multi-Tenant Inference Gateways", lab sfab-ch08.
#
# Build A's state many at step 8, with serving on: chapter 7's lab (every switch, the firewall, the
# cluster with its ingress and GPU nodes, the bastion, the platform's DNS and time servers, the
# registry, the uplink side and the staff client; TrueNAS left out) plus the internet audience's
# Gateway layer, which the spec adds from step 8: Gateway gw-inet at 10.20.11.220 (pool .220 to
# .224) with its own certificate (gw-inet-tls), one route for chat's path and the test backend's
# /echo, the namespaces echo and inference labelled for it, one announcement policy per audience
# (gateways-internal, gateways-enterprise, gateways-internet) and Cilium's tuned lease timers (3 s,
# 1 s, 200 ms; the spec's k8s.l2_announce.lease, one switch), every caller labelled with its audience
# and the internet audience's caller inetapp, and the key tool sfab/keys:4, whose mint refuses a key
# for a model outside the caller's audience. No node, zone, rule, NAT or DNS record is added: the
# internet population has no path until chapter 10, so the chapter's requests run from k8s-cp2, whose
# own datapath answers every Gateway VIP. make up deploys the whole step from wiped disks. It extends
# chapter 7's lab (metadata only: the lab ships complete).
lab: sfab-ch08
profile: a
state: many
slice:
  nodes: [fe, rail, oob, fw, k8s-gpu1, k8s-gpu2, k8s-cp1, k8s-cp2, k8s-cp3, bastion, inet-registry, uplink-rtr, ops-client, ops-dns, ent-client]
features: {k8s: true, serving: true, storage_setup: false}
prints: []
extends: ch07
variants: {}

# The keyed trace (trace.sh, common/trace/lib-servetrace.sh; rendered to gen/trace.json): from
# k8s-cp2, a node of the cluster whose own datapath answers every Gateway VIP (pin: the request names
# the VIP with curl --resolve, and the node's own ports are captured to show no SYN to the VIP leaves
# it). One chat completion on staff's path through the users' Gateway with staff's own key
# (helpdesk's), every key replaced by its keyed mark at the three in-cluster hops; then the same key
# and path through the internet Gateway (also), whose route set carries chat alone: its 404 and no
# request at any API gateway pod; then an admin hostname on the internet Gateway (refuse), its 404.
trace:
  serving:
    client: k8s-cp2
    gateway: gw-users
    model: staff
    max_tokens: 16
    sport: 42806
    keys: true
    pin: true
    also: [{gateway: gw-inet, sport: 42808}]
    refuse: {hostname: admin, path: /echo, sport: 42807, gateway: gw-inet}

# The drill (drills.sh, common/drill/lib-leasedrill.sh; rendered to gen/drills.json): the lease
# holder's two pair ports shut in KLISH on fe-sw1 and fe-sw2 (the ingress node holding the most of
# the three leases, read when the pass begins), held, then no shutdown. The gap is measured with
# probes that need nothing on the cut node but its lease: a GET of the test backend's /echo through
# each Gateway every 2 s on a new connection each time (from the staff client to the users' Gateway,
# from the operator's client to the internal Gateway) and a TCP connect to each of those VIPs every
# 0.5 s; the leases are read every 0.5 s on the lab host for the new holder; the firewall's ARP
# table before, during and after. A chat completion every 2 s through the users' Gateway is recorded
# beside them and reported apart: the API gateway, the router and the identity provider run on the
# ingress nodes too, so the cut node takes its share of them with it until their endpoints leave
# the Services (the pods' places and the EndpointSlices are recorded through each pass). The virtual
# switch gives the cut node no loss of carrier, so the node loses its lease because it cannot renew
# it; the KNOWN line names that limitation on every pass.
drills:
  timing: {lead_s: 20, hold_s: 30, tail_s: 30, settle_max_s: 300, whole_polls: 3}
  list:
    - id: lease-holder-loss
      title: the ingress node holding the most leases cut from the pair, its leases taken by the other
      lease_loss:
        echo:
          - {from: ent-client, gateway: gw-users}
          - {from: ops-client, gateway: gw-internal}
        model: {from: ent-client, gateway: gw-users, model: chat, every: 1}
        interval_s: 2
        connect_interval_s: 0.5
