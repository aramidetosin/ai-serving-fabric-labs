# sfab-ch06 operators: rendered from spec/profile-a.yaml by render/k8s.py; edit the spec and run make render
# The operators' group operators bound to the ClusterRole view. Each operator's kubeconfig on the
# bastion carries a client certificate in that group, issued on the init node for 8 hours by
# kubeadm kubeconfig user (finish, operators); no standing cluster-admin credential leaves the init node.
# view reads namespaced objects only, so the group is also bound to operators-cluster-view,
# which reads the cluster-scoped objects (nodes, namespaces, volumes, classes, CRDs) and no Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operators-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operators-cluster-view
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - namespaces
  - persistentvolumes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  - csidrivers
  - csinodes
  - volumeattachments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - node.k8s.io
  resources:
  - runtimeclasses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operators-cluster-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operators-cluster-view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: operators
