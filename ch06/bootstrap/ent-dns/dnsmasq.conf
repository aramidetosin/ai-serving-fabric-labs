# sfab-ch06 ent-dns: rendered from spec/profile-a.yaml by render/dns.py; edit the spec and run make render
# resolver corporate: the corporate names of tarnwick.example answered here; the platform's zone
# ai.tarnwick.example forwarded to its authoritative servers (dns-auth1, dns-auth2); no other upstream.
port=53
listen-address=127.0.0.1,10.24.10.53
bind-interfaces
no-resolv
no-hosts
no-poll
domain-needed
bogus-priv
log-queries
log-facility=/var/log/dnsmasq.log
local=/tarnwick.example/
server=/ai.tarnwick.example/10.20.13.11
server=/ai.tarnwick.example/10.20.14.11
host-record=ent-client.tarnwick.example,10.24.10.10
host-record=ent-dns.tarnwick.example,10.24.10.53
