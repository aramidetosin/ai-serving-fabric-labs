  # registry. The helm project publishes no image of its own; this one carries the upstream release
  # binary at the bastion's helm version below, which upgrades the same release. It comes from
  # Docker Hub, so the seed copies its linux/amd64 manifest only, and the node pulls it by that
  # manifest's digest (platform_digest, the pinned index's linux/amd64 entry), never by the index.
