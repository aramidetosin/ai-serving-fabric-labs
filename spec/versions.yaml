# Every pin the labs use (FRAMEWORK.md sections 2.4, 3.1 and 5).
#
# images: ref is what the topology names. vrnetlab images are built on the lab host from the
# reader's own vendor image and never pulled; their digest is local to each host, so it stays
# null here and preflight (pf_images) records it in every result set. images/VENDOR-IMAGES.md
# says where each vendor image comes from and how to build it. sfab/* images are built from this
# repo by `make -C images`. status: candidate marks a pin that becomes final in the commit that
# lands its first chapter; from that commit on it reads status: final.

images:
  dell_sonic:
    ref: vrnetlab/dell_sonic:4.6.0
    source: platform/dell-sonic-4.6.0
    # vrnetlab (MIT; platform/dell-sonic-4.6.0/LICENSE.vrnetlab) at one commit for every file the
    # build takes from it: dell/dell_sonic, common/ and the top-level makefiles. Each blob is what
    # `git rev-parse <commit>:<path>` prints in a checkout; the launcher's is vrnetlab's own file,
    # which launch.py.upstream-plus-numnics extends (platform/dell-sonic-4.6.0/README.md).
    vrnetlab:
      repository: https://github.com/srl-labs/vrnetlab
      commit: 3a34fa63d73843c871f248e2df2ffa5c038183ce
      blobs:
        dell/dell_sonic/docker/launch.py: 055afa9f5a2cd5336395abc2774ad549b3c3ad6e
        common/vrnetlab.py: 0b6bbf45df659e2785659708a78a6ef090e13887
        common/healthcheck.py: 49053b63729fe3c67113b8c5649e96a4097bfa4e
    pulled: false
    digest: null
  pa_vm:
    ref: vrnetlab/paloalto_pa-vm:12.1.2
    source: platform/paloalto-pa-vm-12.1.2
    # vrnetlab at the commit the recorded image names in its vrnetlab-version label, for every file
    # the build takes from it: paloalto/pan, common/ and the top-level makefiles. The launcher's
    # blob is vrnetlab's own file, which launch.py.patched replaces whole
    # (platform/paloalto-pa-vm-12.1.2/README.md).
    vrnetlab:
      repository: https://github.com/srl-labs/vrnetlab
      commit: fd759f10587de4dd131815c8b7066ce3f957c749
      blobs:
        paloalto/pan/docker/launch.py: 817ca9f79ba29cd71275796cde006c67671c7e02
        common/vrnetlab.py: 7eab1072d3183cefa00ed2a97aa547883e4af9f0
        common/healthcheck.py: 49053b63729fe3c67113b8c5649e96a4097bfa4e
    pulled: false
    digest: null
  # TrueNAS and ONTAP: vrnetlab's truenas/truenas and netapp/ontap at commit, the first that holds
  # both, with common/ taken from common_commit, the parent of ddaac458 (which moved
  # common/test_vrnetlab.py out of common/); d142be03 later changed common/vrnetlab.py. Each blob
  # is a file the build copies into the image; the TrueNAS image the recordings ran on holds
  # exactly these (images/VENDOR-IMAGES.md).
  truenas:
    ref: vrnetlab/truenas_truenas:27.0.0-RC.1
    source: vrnetlab truenas/truenas
    vrnetlab:
      repository: https://github.com/srl-labs/vrnetlab
      commit: c89aa5e8cdb3805fbc94b04f120d68847e2d377b
      common_commit: da55d7cf48c1674422100a3bec2612f375dc1f4f
      blobs:
        truenas/truenas/docker/launch.py: 31c976daca8d56431c861e90c0cbed666a57c356
        truenas/truenas/docker/tnrpc.py: 2c299a20e77f689aaf48343810eb70972ca3f56a
        common/vrnetlab.py: 73aeb0be3d694ed08bd7011566ed0c545dc5f16d
        common/healthcheck.py: 49053b63729fe3c67113b8c5649e96a4097bfa4e
        common/test_vrnetlab.py: 173f903e2f19ee76edd25a590ed8f82a42de68a4
    pulled: false
    digest: null
  ontap:
    ref: vrnetlab/netapp_ontap:9.17.1
    source: vrnetlab netapp/ontap
    vrnetlab:
      repository: https://github.com/srl-labs/vrnetlab
      commit: c89aa5e8cdb3805fbc94b04f120d68847e2d377b
      common_commit: da55d7cf48c1674422100a3bec2612f375dc1f4f
      blobs:
        netapp/ontap/docker/launch.py: 769d8180820c2fc040fa8d7bd9604c4eef1db319
        common/vrnetlab.py: 73aeb0be3d694ed08bd7011566ed0c545dc5f16d
        common/healthcheck.py: 49053b63729fe3c67113b8c5649e96a4097bfa4e
        common/test_vrnetlab.py: 173f903e2f19ee76edd25a590ed8f82a42de68a4
    pulled: false
    digest: null
    status: candidate
  frr_upstream:
    ref: quay.io/frrouting/frr:10.5.4
    digest: sha256:17a66aa754b4f60d58fae6cf3c357b62cfb574beb2a4cacd26d50e3df8440b78
