      startupapicheck: {ref: "quay.io/jetstack/cert-manager-startupapicheck:v1.21.2", digest: "sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5"}
      acmesolver: {ref: "quay.io/jetstack/cert-manager-acmesolver:v1.21.2", digest: "sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503", used: false}
