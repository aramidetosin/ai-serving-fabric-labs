    status: final
  # Not used: each pod's rail address comes from the placement (render/k8s.py, serving.env) and is
  # set by the CNI static IPAM plugin, which the node disk holds with macvlan (kubernetes-cni).
  whereabouts: {version: null, status: not used}
  # The API gateway and the model router (chapter 7), pulled by the nodes through the in-lab
  # registry. One platform each (platforms: one): the seed copies the linux/amd64 manifest the
  # pinned index names, and a pod names the image by that manifest's digest (platform_digest).
