      pause: {ref: "registry.k8s.io/pause:3.10.1", digest: "sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c"}
    status: final
  # Cilium (render/k8s.py): the 1.19 release M2, chapter 3 and chapter 4 ran and recorded with this
  # kubeadm and Gateway API v1.4.1 (1.19.9 and 1.20.3 are current on 2026-10-20). The sha256 is the
  # chart repository index's digest of cilium-1.19.7.tgz. Each image digest is the one the chart's
  # own values name, set again as an override in the values file, so the registry holds what runs.
  cilium:
    version: 1.19.7
    chart: {name: cilium, repo: "https://helm.cilium.io", version: "1.19.7", sha256: af6aeba999b438b897e71452051aab2c014bb89369ab34ca46a33003eb0d017e}
