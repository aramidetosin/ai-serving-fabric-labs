  # own sandbox image, so the two agree.
  control_plane:
    images:
      kube_apiserver: {ref: "registry.k8s.io/kube-apiserver:v1.35.8", digest: "sha256:6a7b73e718540d2c097cbcdc84c0f2cffad7a51ebccaf7f0b8cceb464715e1d9"}
      kube_controller_manager: {ref: "registry.k8s.io/kube-controller-manager:v1.35.8", digest: "sha256:b27c0bf88a81437747b257a1e6d019a921ec3a97b724e67dfc180efe3125998b"}
      kube_scheduler: {ref: "registry.k8s.io/kube-scheduler:v1.35.8", digest: "sha256:f4334826c53876b700f73cd06a69c405c6f882a4116c5813786e046ee6eca1ac"}
      etcd: {ref: "registry.k8s.io/etcd:3.6.6-0", digest: "sha256:60a30b5d81b2217555e2cfb9537f655b7ba97220b99c39ee2e162a7127225890"}
