  # the last tagged release (v1.9.5) lacks, pinned by the digest `next` named on 2026-10-14 (and
  # still named on 2026-10-20). Every image the chart starts is pinned by digest, so the in-lab
  # registry holds exactly what the nodes pull. The snapshotter stays off until the cluster
