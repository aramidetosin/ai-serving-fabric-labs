  # chapter 6's). The manifest is the release tag's deployments/multus-daemonset-thick.yml, kept in
  # the repo at file and checked against this sha256 at every render. The seed copies one platform
  # (platforms: one), so the render names the image by the linux/amd64 manifest the pinned index
