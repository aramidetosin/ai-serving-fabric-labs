  # kubelet and kubectl take the kubeadm version.
  packages: {kubeadm: 1.35.8-1.1, kubernetes_cni: 1.8.0-1.1, cri_tools: 1.35.0-1.1}
  # The control plane kubeadm v1.35.8 starts (kubeadm's own image constants for 1.35), pulled
