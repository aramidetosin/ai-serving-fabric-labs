    pulled: true
  # registry:2 is distribution 2.8.3, the index Docker Hub named for both tags on 2026-10-20.
  registry_upstream:
    ref: registry:2
    digest: sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    pulled: true
  # The copier `make -C images registry-seed` runs (images/registry/seed.py). The project
  # rebuilds its plain tags daily; the -immutable tag is the fixed build of v1.22.3.
  skopeo:
    ref: quay.io/skopeo/stable:v1.22.3-immutable
    digest: sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5
    pulled: true
  # From vm-node 4 on, netsetup.sh builds the bond's tagged units (the GPU nodes' storage VLAN, the
  # ingress nodes' VLAN with its own routing table) and moves the BMC NIC into its own namespace.
  # From vm-node 5 on, cluster-bootstrap.sh writes the API server's EncryptionConfiguration (Secrets
  # at rest) on the init node and shares it with the other control nodes. From vm-node 6 on, a GPU
  # node whose container binds the models directory at /models exports it to the guest read-only
  # (virtio-9p, mount tag models), and the guest mounts it at /srv/models before kubelet starts.
  vm_node:
    ref: sfab/vm-node:6-k8s1.35.8
    source: images/vm-node
    pulled: false
  # From bastion 4 on, the bastion is a jump host only: no BIND, no chrony and no CA in the image.
  bastion:
    ref: sfab/bastion:4
    source: images/bastion
    base: ubuntu_base
    pulled: false
  resolver:
    ref: sfab/resolver:3
    source: images/resolver
    base: alpine_base
    # Alpine 3.20's own builds, installed as apk add <name>=<version> (images/resolver/image.mk);
    # bind-tools, at bind's version, holds named-checkzone and rndc-confgen. Chapter 9 records
    # dnsmasq's AAAA answers on exactly this release. chrony (from resolver 3 on)
    # serves time on the resolvers and the time reference, with NTS (built with GnuTLS).
    packages: {bind: 9.18.49-r0, dnsmasq: 2.90-r3, chrony: 4.5-r0}
    pulled: false
  # From bastion 2, client 2, frr 10.5.4-2, registry 2 and resolver 2 on, the init scripts write
  # resolv.conf's search line as the lab's domain, never the one Docker copies from the lab
  # host's own file. From bastion 3, frr 10.5.4-3 and vm-node 2 on, the login user is admin.
  client:
    ref: sfab/client:2
    source: images/client
    pulled: false
  # The operator site's VPN router (chapter 4): strongSwan from Alpine 3.20's own
  # mirror on sfab/client, the two packages the client lacks checked by sha256 before they install
  # (fetched and verified on 2026-10-27).
  # From vpngw 2 on, vpngw-run.sh finds charon by its process name, not its pid file (a second
  # charon started beside a starting one deleted the live one's control socket).
  # From vpngw 3 on, the router takes the admin SSH login like the FRR routers (key only, on its
  # management address only), so openssh-server, its common files and sudo join the pins (fetched
  # and verified with apk verify on 2026-10-28).
  vpngw:
    ref: sfab/vpngw:3
    source: images/vpngw
    base: client
    packages: {strongswan: 5.9.13-r2, gmp: 6.3.0-r1, openssh_server: 9.7_p1-r5, sudo: 1.9.15_p5-r0}
    sha256:
      strongswan: 36a5e5284ba652f57d3f2a88323ecad536014d96600717aa9d6e546f960b3f47
      gmp: dfc94acb8d7e33d3505b583b010932a3a49ea0388c2ba145ff6edafa7bf1104f
      openssh_server: 6642fe02ce9fadc27477c2e3472acc9dbbad64a62592ac451a0e505e13837250
      openssh_server_common: c7755d7534b95fbdeb5b0800dc4932d9fa37c4309dd0aec261f53413395d7269
      sudo: eb1748b6bec6f198b6add1a7bdabe4e72eebcefbffa5c3580858f0f48d5c8b66
    pulled: false
  frr:
    ref: sfab/frr:10.5.4-3
    source: images/frr
    base: frr_upstream
    pulled: false
  # From registry 3 on, the lab's registry serves HTTPS with its leaf of the
  # lab's internet intermediate (state/tls/inet-registry, bound at /sfab/tls).
  registry:
    ref: sfab/registry:3
    source: images/registry
    base: registry_upstream
    pulled: false
  # The serving image's base (serving-layer/image): Debian 12 slim, the index Docker Hub named for
  # the tag on 2026-10-21. The build pulls it by this digest.
  debian_base:
    ref: debian:12-slim
    digest: sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
    pulled: true
  # The two images the cluster pulls that this repository builds (mirror: local): the model server
  # and its RPC workers (serving-layer/image, its inputs pinned under serving: below) and the API
  # key tool (images/keys, built on sfab/client, its one library pinned under keys: below).
  # `make -C images registry-seed` pushes each from the lab host's Docker into the in-lab registry
  # as <mirror>/<repository>:<tag>, and the nodes pull it from there by that name.
  serving:
    ref: sfab/serving:b11382-2
    source: serving-layer/image
    base: debian_base
    mirror: local
    pulled: false
  keys:
    ref: sfab/keys:3
    source: images/keys
    base: client
    mirror: local
    pulled: false

tools:
  # The release preflight (pf_tools) wants exactly, always the latest release (the author's rule,
  # 2026-10-27): 0.81.0, then 0.81.1 on 2026-10-20, then 0.82.0 on 2026-10-27. Each lab's RESULTS.md
  # names the release it was recorded on; M1's facts were on 0.81.0 (dev/m1/RESULTS.md), M2's on
  # 0.81.1 (dev/m2/RESULTS.md, settle item 5).
  containerlab: 0.82.0
  python: "3.10"

kubernetes:
  version: v1.35.8
