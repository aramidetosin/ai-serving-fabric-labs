  ubuntu_cloud_image: {release: "24.04", serial: "20260826", sha256: d0fe84bb5f80853425fa6be28e2c106f30104c3cfe8611933f2e65c9b63f0e30, status: final}

ubuntu_archive:
  # The Ubuntu archive as snapshot.ubuntu.com serves it at this moment. The vm-node runtime image
  # and the bake install every Ubuntu package from it, so the same pins always give the same
  # packages. It must not be older than the ubuntu_base image (built 2026-09-11).
  snapshot: 20260912T000000Z

# The serving image's inputs (serving-layer/image). `make -C images serving-fetch` puts each in the
# vendor directory (VENDOR_DIR, default vendor/serving/ in the checkout), using a copy already there
# when its sha256 matches and downloading it from url otherwise, and refuses a file whose sha256
# differs; the build reads only those files.
# - llama.cpp: the upstream release b11382's x64 Ubuntu build (MIT), whose llama-server and
#   ggml-rpc-server need libgomp.so.1, libssl.so.3 and libcrypto.so.3 beyond Debian 12 slim
#   (ldd in the pinned base, 2026-10-21).
# The models are not in the image (build A revision 2: weights from a host directory). Each is
# pinned under serving.models: the Hugging Face repository and revision, the file, its sha256 and
# size; `make -C images models-fetch` puts both in images/models (git ignores it; with
# SFAB_MODELS_STORE=<dir> they live in <dir> and images/models is a link to it, which
# `make -C images models-link` puts back after a sync), each checked against its sha256, and a lab
# with serving on binds that directory read-only into its GPU nodes' containers, whose guests mount
# it at /srv/models (vm-init.sh, the models share).
# - The two Debian 12 packages that hold those libraries, as the pinned base's apt sources named
#   them on 2026-10-21 (libssl3 from bookworm-security); each sha256 is the archive's own
#   Packages entry, which the downloaded file matched.
serving:
  llama_cpp:
    release: b11382
    license: MIT
    asset: llama-b11382-bin-ubuntu-x64.tar.gz
    url: "https://github.com/ggml-org/llama.cpp/releases/download/b11382/llama-b11382-bin-ubuntu-x64.tar.gz"
    sha256: 34407d59947ed4ab35fe4ab2db5f61bb4d5aedfe25e6a72f702f3ae9758a396d
    size: 17669957
  # The two models (the author's choice, 2026-10-27): chat is Liquid AI's LFM2.5-24B-A2B (a
  # mixture of experts, GGUF architecture lfm2moe; LFM Open License v1.0), staff is Qwen3.8-27B
  # (dense, GGUF architecture qwen35; Apache-2.0) as Unsloth's GGUF, since Qwen publishes none. Both
  # load in llama.cpp b11382 (checked on the lab host, 2026-10-28, through ggml-rpc-server too).
  models:
    chat:
      name: LFM2.5-24B-A2B
      format: gguf
      quant: q4_k_m
      license: LFM Open License v1.0
      repository: LiquidAI/LFM2.5-24B-A2B-GGUF
      revision: 0912d33141f77e10705345a6732bfd83f0252fdc
      file: LFM2.5-24B-A2B-Q4_K_M.gguf
      url: "https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF/resolve/0912d33141f77e10705345a6732bfd83f0252fdc/LFM2.5-24B-A2B-Q4_K_M.gguf"
      sha256: d3334405b96228eb9908cdebb5c6194908f2da64282bda852afc3a3910c64e7d
      size: 14526258464
    staff:
      name: Qwen3.8-27B
      format: gguf
      quant: ud-q4_k_m
      license: Apache-2.0
      repository: unsloth/Qwen3.8-27B-GGUF
      revision: 4ca720788d1e01f1bff70c033e0d0028fd02e502
      file: Qwen3.8-27B-UD-Q4_K_M.gguf
      url: "https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-Q4_K_M.gguf"
      sha256: 322e194ff79741c7baa497c240f677f54b201b0efab44ca8e50f122b39123482
      size: 16464440224
  debs:
